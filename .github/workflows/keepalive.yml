name: Keepalive

# Redundant backup for the pg_cron job in Supabase. GitHub disables scheduled workflows after
# 60 days without repo activity, so this alone is not enough; the database job is the primary.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keepalive function
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/keepalive" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
